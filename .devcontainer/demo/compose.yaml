# The demo in a GitHub Codespace ([D-235]): devcontainer.json beside this file.
services:
  # The released demo image, as the README's `docker run` starts it.
  demo:
    image: codeberg.org/sclermont/shoppinglist:demo
  # Only for the Codespace to attach to: the demo image is distroless, with no
  # shell. It shares the demo's network, so the demo is its localhost:8090.
  workspace:
    image: mcr.microsoft.com/devcontainers/base:trixie@sha256:71b6fe7c4e07ec747a94a72b2a17f2f8c286eaa7b1c59862888df764efb8b6c6
    command: sleep infinity
    network_mode: service:demo
    volumes:
      - ../..:/workspaces:cached
