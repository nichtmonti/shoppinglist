# pnpm settings for the e2e project.
# A release resolves only once it is three days old (minutes), transitives
# included; renovate.json5 holds its updates to the same age.
minimumReleaseAge: 4320
# A release published with weaker evidence than an earlier one (trusted
# publisher, then provenance, then none) is refused: what a hijacked npm
# account publishes looks like that.
trustPolicy: no-downgrade
# minimatch's advisory fix is 11 only, which eslint and typescript-eslint do
# not allow yet; frontend/pnpm-workspace.yaml says why the major is safe. Drop
# it once they take 11.
overrides:
  minimatch: ^11.0.1
