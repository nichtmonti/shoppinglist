# pnpm settings home (pnpm >=10 reads no settings from package.json anymore).
# allowBuilds: esbuild needs its postinstall to fetch/compile the platform
# binary; without this opt-in pnpm blocks the build script. unrs-resolver
# (the lint's TypeScript import resolver) ships its binary as an optional
# dependency and needs no build: its postinstall only fetches one that is
# missing.
allowBuilds:
  esbuild: true
  unrs-resolver: false
# A release resolves only once it is three days old (minutes), transitives
# included; renovate.json5 holds its updates to the same age.
minimumReleaseAge: 4320
# A release published with weaker evidence than an earlier one (trusted
# publisher, then provenance, then none) is refused: what a hijacked npm
# account publishes looks like that.
trustPolicy: no-downgrade
# chokidar 4.0.2 and 4.0.3 (svelte-check's) came from its maintainer's own
# machine in December 2024, without the provenance 4.0.1 had; drop the entry
# once svelte-check takes chokidar 5.
trustPolicyExclude:
  - chokidar@4.0.3
# Dependency-advisory fixes for transitives whose parents pin them too tight to
# take the fixed version in-range: nanoid+postcss (eslint-plugin-svelte/vite),
# patch-level; minimatch (eslint, typescript-eslint), a major whose fix
# 10.x never got, safe because they call only `new Minimatch(…).match()` and
# `minimatch()`, which 11 kept. These are the osv-scan findings from
# .woodpecker/security.yaml; drop an entry once the parent bumps its range
# (SvelteKit 3 did for cookie and devalue; undici left with jsdom; minimatch 11
# did for brace-expansion).
overrides:
  minimatch: ^11.0.1
  nanoid: ^3.3.17
  postcss: ^8.5.23
