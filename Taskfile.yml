# The commit gate and the browser harnesses, as go-task tasks (tools/task,
# [D-177]); docs/internals/impl-notes.md says what each runs. Run them through
# scripts/gate.sh, which takes the same arguments (`scripts/gate.sh e2e:arch
# -- --last-failed`) and adds what go-task leaves out. `task --list` shows the
# tasks to run: gate, gate:full and e2e:all have no desc, since the default,
# `full` and `e2e` run them under the machine lock.
#
# What runs is decided by the tools, not by path rules here: a task whose
# `sources` are unchanged since it last PASSED is skipped (one without
# `sources` runs every time, and a failed layer reruns until it passes),
# `vitest --changed` and the changed-file lint scope to the diff, and Go's
# test cache replays unchanged packages. The checksums live in .task/, per
# checkout.
#
# Two layers at a time (.taskrc.yml), inside the box's 8 GB. One gate or
# harness run at a time on the machine (scripts/lib/lock.sh).
version: '3'

output: prefixed

vars:
  # The diff the changed-file layers scope to: everything not yet on
  # origin/main, the commits since the merge base and the working tree, on
  # any branch; SINCE picks another base ([D-299]). Scoped to the uncommitted
  # files only, a commit took its changes out of reach, and a layer that then
  # reached no test passed and was skipped from then on, since its `sources`
  # had not changed. Without origin/main (a clone with no remote), HEAD.
  # SINCE is read from the environment: go-task evaluates this before it
  # applies a variable given as an argument (scripts/gate.sh exports one).
  # A SINCE that names no commit fails the run rather than checking less.
  BASE:
    sh: |
      if [ -n "${SINCE:-}" ]; then git merge-base "$SINCE" HEAD
      else git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD; fi
  LOCK: scripts/lib/lock.sh
  BIN: '{{.ROOT_DIR}}/backend/shoppinglist'
  BIN_NOUI: '{{.ROOT_DIR}}/backend/shoppinglist-no-ui'
  BIN_DEMO: '{{.ROOT_DIR}}/backend/shoppinglist-demo'

tasks:
  default:
    desc: The commit gate, scoped to what is not yet on origin/main, no browser
    cmds:
      - '{{.LOCK}} gate task gate'

  gate:
    deps: [format, gofmt, gitleaks, repo-rules, osv, lint, check, check:e2e, go-lint, go-test, vitest, integration]

  full:
    desc: Every non-browser layer at full scope (a release, a toolchain bump)
    cmds:
      - '{{.LOCK}} gate task --force gate:full'

  gate:full:
    deps: [format, gofmt, gitleaks, repo-rules, osv, lint:all, check, check:e2e, go-lint, go-test, vitest:all, integration]

  # --- dependencies ------------------------------------------------------------
  deps:
    desc: Install node_modules from the lockfiles (a fresh worktree has none)
    sources:
      - pnpm-lock.yaml
      - frontend/pnpm-lock.yaml
      - e2e/pnpm-lock.yaml
    status:
      - test -d node_modules && test -d frontend/node_modules && test -d e2e/node_modules
    cmds:
      # A failed layer names itself for scripts/gate.sh's summary (go-task
      # reports only the first failure).
      - defer: &failed '{{if and .EXIT_CODE (ne .EXIT_CODE "0")}}[ -z "$GATE_FAILED" ] || echo {{.TASK}} >>"$GATE_FAILED"{{end}}'
      - for: [., frontend, e2e]
        cmd: cd {{.ITEM}} && pnpm install --frozen-lockfile --prefer-offline

  # --- static layers -----------------------------------------------------------
  format:
    desc: Prettier over the repo; its cache skips files unchanged since they passed
    deps: [deps]
    cmds:
      - defer: *failed
      - pnpm format:check

  gofmt:
    desc: gofmt over the backend
    cmds:
      - defer: *failed
      # The assignment keeps gofmt's own exit status: a file it cannot parse
      # fails the layer.
      - 'files=$(gofmt -l backend) && { [ -z "$files" ] || { echo "$files" >&2; exit 1; }; }'

  gitleaks:
    desc: gitleaks over the history (CI's scan) and over the uncommitted changes
    # [D-274] Every run, no sources: about 4 s, and its input is the history,
    # which every commit changes. The history scan is go.yaml's own, and
    # covers local commits not yet pushed; the --pre-commit scans and the
    # untracked files' catch a secret before it is committed at all. The
    # pre-push hook (.githooks/pre-push) repeats the history scan at the push.
    cmds:
      - defer: *failed
      - go -C tools/gitleaks install tool
      - gitleaks git . --no-banner --redact
      - gitleaks git . --pre-commit --no-banner --redact
      - gitleaks git . --pre-commit --staged --no-banner --redact
      # A new file is in no diff until it is staged: each untracked, unignored
      # one on its own.
      - git ls-files -z --others --exclude-standard | xargs -0 -r -n1 gitleaks dir --no-banner --redact

  osv:
    desc: osv-scanner over every lockfile, CI's osv-scan step, when a dependency changed
    # A new dependency once brought three advisories that only CI's security
    # workflow saw, after the push. Its inputs are the lockfiles and the
    # waivers; an advisory published later for an unchanged lockfile is still
    # CI's to find; security.yaml runs this task. --config: a bare
    # osv-scanner.toml applies only to lockfiles in its own directory, so the
    # root file would never see backend/go.mod. --no-ignore: a worktree sits
    # under .claude/worktrees, which the main checkout ignores, and osv reads
    # that .gitignore and finds no lockfile at all; with it, CI's module cache
    # in the workspace (.gomod, go.yaml says why) would be scanned, test
    # fixtures included, so it is excluded. --no-call-analysis=go: the
    # tools/<name> modules hold only `tool` directives, so osv's govulncheck
    # pass finds no packages there and exits 127; reachability for the app is
    # govulncheck's job ([D-201]).
    sources:
      - '**/pnpm-lock.yaml'
      - '**/go.mod'
      - '**/go.sum'
      - tools/diff-cover/requirements.txt
      - osv-scanner.toml
      - exclude: '**/node_modules/**/*'
    cmds:
      - defer: *failed
      - go -C tools/osv-scanner install tool
      - osv-scanner scan -r . --config osv-scanner.toml --no-call-analysis=go --no-ignore --experimental-exclude=.gomod

  repo-rules:
    desc: The repo's own rules, as CI checks them (decision index and citation links, doc links and names, CI image tag)
    # About four seconds, every run, no sources, as gitleaks: doc-links reads
    # every tracked file (the task list through go-task), so no list here
    # names its inputs. Without them here
    # a docs-only commit passed the gate and failed CI's frontend and ci-image
    # workflows.
    cmds:
      - defer: *failed
      - node scripts/decisions-index.mjs --check
      - node scripts/doc-links.mjs
      - scripts/ci-image-tag.sh --check

  licenses:
    desc: Regenerate docs/THIRD_PARTY_LICENSES.md and docs/sbom.cdx.json from what ships; `-- --check` compares instead (CI)
    deps: [deps]
    cmds:
      - node scripts/third-party-licenses.mjs {{.CLI_ARGS}}

  lint:
    desc: The type-aware lint on the changed frontend files; all of it when its config changed
    deps: [deps]
    sources: &frontend
      - frontend/src/**/*
      - frontend/messages/**/*
      - frontend/project.inlang/{settings.json,paraglide.config.js}
      - frontend/*.{js,ts,json,jsonc}
      - frontend/scripts/*.js
      - frontend/src/service-worker/tsconfig.json
      - frontend/pnpm-lock.yaml
      # What the frontend imports from the backend: the seed data, its test
      # vectors, the field contract and the shell's meta names.
      - backend/seed/*.json
      - backend/internal/fieldcontract/*.json
      - backend/internal/ui/*.json
      # Generated from messages/ by every check and test run; were it a
      # source, each run would leave the next one stale.
      - exclude: frontend/src/lib/paraglide/**/*
    cmds:
      - defer: *failed
      # Exact for every file you touched: typed rules check each file against
      # the whole program. A finding in an untouched file caused by a changed
      # type is CI's full run to catch ([D-243]).
      # The lists are taken first, so a git that fails stops the layer instead
      # of passing an empty list.
      - |
        changed=$(git diff --name-only {{.BASE}}) || exit 1
        if printf '%s\n' "$changed" | grep -qE '^frontend/(eslint[^/]*\.js|package\.json|pnpm-lock\.yaml|tsconfig[^/]*\.json)$'; then
          cd frontend && pnpm lint
        else
          files=$(git diff --name-only --diff-filter=d {{.BASE}} -- frontend && git ls-files --others --exclude-standard -- frontend) || exit 1
          printf '%s\n' "$files" | grep -E '\.(ts|js|svelte)$' | sed 's#^frontend/##' | sort -u |
            (cd frontend && xargs -r -d '\n' node scripts/lint.js)
        fi

  lint:all:
    desc: The type-aware lint over the whole frontend
    deps: [deps]
    cmds:
      - defer: *failed
      - cd frontend && pnpm lint

  check:
    desc: svelte-check, the service worker's tsc, and knip (what nothing uses any more)
    deps: [deps]
    sources: *frontend
    cmds:
      - defer: *failed
      - cd frontend && pnpm check
      - cd frontend && pnpm exec knip --no-progress

  check:e2e:
    desc: tsc and the typed ESLint over the browser harnesses, which Playwright runs with their types stripped
    deps: [deps]
    sources:
      - e2e/**/*.ts
      - e2e/eslint.config.js
      - e2e/tsconfig.json
      - e2e/package.json
      - e2e/pnpm-lock.yaml
      - exclude: e2e/node_modules/**/*
    cmds:
      - defer: *failed
      - cd e2e && pnpm check && pnpm lint

  # --- tests -------------------------------------------------------------------
  go-lint:
    desc: go vet, go fix, staticcheck, gosec, golangci-lint and deadcode over the backend, CI's go-check step
    # [D-273] CI's go-check runs this task, so a pass here is a pass there: a
    # Go toolchain bump once broke both tools in CI alone. Their pins are
    # inputs too, and installing from them is a no-op once built. The memory
    # cap: a cold staticcheck peaks near 900 MiB, beside the 1.4 GB lint in
    # the box's 8 GB (CI's step sets its own, which wins). -tags no_ui: no SPA
    # is built here ([D-64]).
    sources:
      - backend/**/*.go
      - backend/go.mod
      - backend/go.sum
      - tools/staticcheck/go.mod
      - tools/staticcheck/go.sum
      - tools/gosec/go.mod
      - tools/gosec/go.sum
      - tools/golangci-lint/go.mod
      - tools/golangci-lint/go.sum
      - tools/deadcode/go.mod
      - tools/deadcode/go.sum
      - backend/.golangci.yml
      - exclude: backend/pb_data/**/*
      - exclude: backend/pb_public*/**/*
    env:
      GOMEMLIMIT: 1GiB
    cmds:
      - defer: *failed
      - go -C tools/staticcheck install tool
      - go -C tools/gosec install tool
      - go -C tools/golangci-lint install tool
      - go -C tools/deadcode install tool
      # `go test` runs only part of vet (no copylocks, no structtag). The demo
      # build swaps one file in package main, which is vetted again with its
      # tag ([D-234]).
      - cd backend && go vet -tags no_ui ./...
      - cd backend && go vet -tags demo,no_ui .
      # Go's own modernizers: -diff prints what `go fix` would change and
      # fails; run `go fix -tags no_ui ./...` in backend/ to apply it.
      - cd backend && go fix -tags no_ui -diff ./...
      - cd backend && go fix -tags demo,no_ui -diff .
      - cd backend && staticcheck -tags no_ui ./...
      # Our own code's patterns (weak crypto, math/rand, path traversal): its
      # findings follow from the diff, so it runs on every push, not with the
      # advisory scanners ([D-203]). A finding is fixed, or gets a `#nosec`
      # with its why at the line.
      - cd backend && gosec -tags no_ui ./...
      # The bug classes the two above do not look at ([D-340]), as
      # backend/.golangci.yml lists them.
      - cd backend && golangci-lint run ./...
      # [D-340] A function nothing calls, tests included (-test). One that
      # only the other build calls is printed by one run, so a line both runs
      # print is dead; the price is a file only one build compiles
      # (demo_on.go, demo_off.go), whose dead code one run alone prints.
      - >-
        cd backend && set -o pipefail &&
        dead=$({ deadcode -test -tags no_ui ./... && deadcode -test -tags demo,no_ui ./...; } | sort | uniq -d) &&
        if [ -n "$dead" ]; then echo "$dead"; echo "deadcode: nothing calls these, tests included, in either build"; exit 1; fi

  go-test:
    desc: The backend suite, then package main as the demo build ([D-234]); `go test` arguments after `--`
    sources:
      - backend/**/*.go
      - backend/**/*.json
      - backend/go.mod
      - backend/go.sum
      # The files outside backend/ the TestDocs tests read ([D-337]).
      - README.md
      - CHANGELOG.md
      - docs/using.md
      - docs/deploying.md
      - docs/deploy-reference.md
      - docs/operating.md
      - docs/internals/design.md
      - .env.example
      - Dockerfile.demo
      - docker-compose.yml
      - frontend/messages/*.json
      - frontend/src/lib/i18n/wording.json
      - exclude: backend/pb_data/**/*
      - exclude: backend/pb_public*/**/*
    cmds:
      - defer: *failed
      - cd backend && go test -tags no_ui {{.CLI_ARGS}} ./...
      # Go's test cache sees no file outside the module, so a docs-only edit
      # would leave their passing results cached.
      - cd backend && go test -tags no_ui -count=1 -run '^TestDocs' ./...
      - cd backend && go test -tags demo,no_ui .

  vitest:
    desc: The unit and component tests the change reaches (vitest --changed)
    deps: [deps]
    sources: *frontend
    cmds:
      - defer: *failed
      # A config change or a message edit reruns everything (forceRerunTriggers
      # in vite.config.ts); a change no test imports passes.
      # --silent=passed-only: a passing test's console output (sync retries,
      # Svelte dev warnings) is noise; a failing one's is shown ([D-203]).
      # With a commit, vitest adds the staged, unstaged and untracked files.
      - cd frontend && npx vitest run --changed {{.BASE}} --project server --project client --passWithNoTests --silent=passed-only

  vitest:all:
    desc: Every unit and component test (vitest's arguments after `--`, as CI's coverage run)
    deps: [deps]
    cmds:
      - defer: *failed
      - cd frontend && npx vitest run --project server --project client --silent=passed-only {{.CLI_ARGS}}

  build-backend:
    desc: The binary without the SPA, for the integration project
    sources:
      - backend/**/*.go
      - backend/**/*.json
      - backend/go.mod
      - backend/go.sum
      - exclude: backend/pb_data/**/*
      - exclude: backend/pb_public*/**/*
    generates:
      - backend/shoppinglist-no-ui
    cmds:
      - defer: *failed
      # -cover when GOCOVERDIR is set (CI's e2e workflow): the server then
      # writes what the suites reached there as it exits ([D-203]).
      - cd backend && go build {{if .GOCOVERDIR}}-cover {{end}}-tags no_ui -o shoppinglist-no-ui .

  integration:
    desc: Two Dexie clients against a real binary, when the engine or the server changed
    deps: [deps, build-backend]
    sources:
      # The wire, the engine and the modules the actions decide with
      # (dedup/normalize decide the server's merge, [D-44]; field-contract
      # holds the caps the push route enforces), plus the server itself.
      - frontend/src/lib/{sync,actions,db,pb,idb,auth,backup,categories,dedup,normalize,item-name,sorting,field-contract,test-kit}*
      - frontend/src/lib/{sync,actions,db,pb,idb,auth,backup,categories,dedup,normalize,item-name,sorting,field-contract,test-kit}/**/*
      - frontend/src/integration/**/*
      # The small modules they import (http-status, config, i18n, toasts …)
      # and the add model the behaviour specs drive.
      - frontend/src/lib/*.ts
      - frontend/src/lib/i18n/**/*
      - frontend/src/lib/components/add/*.ts
      # The libraries under them (Dexie, pocketbase-js, PocketBase) and the
      # project's own config.
      - frontend/*.{js,ts,json}
      - frontend/pnpm-lock.yaml
      - backend/go.mod
      - backend/go.sum
      - backend/**/*.go
      - backend/**/*.json
      - exclude: backend/**/*_test.go
      - exclude: backend/pb_data/**/*
      - exclude: backend/pb_public*/**/*
    env:
      SHOPPINGLIST_BIN: '{{.BIN_NOUI}}'
    cmds:
      - defer: *failed
      - cd frontend && npx vitest run --project integration --silent=passed-only

  # --- coverage ([D-203]) -------------------------------------------------------
  # A report, not a gate: the total, and the changed lines no test reaches
  # against DIFF_BASE below. CI runs both; locally they compare what is not yet
  # on origin/main (or everything since SINCE).
  diff-cover:
    internal: true
    sources:
      - tools/diff-cover/requirements.txt
    status:
      - test -x tools/diff-cover/.venv/bin/diff-cover
    cmds:
      - python3 -m venv tools/diff-cover/.venv
      - tools/diff-cover/.venv/bin/pip install --quiet --disable-pip-version-check --require-hashes -r tools/diff-cover/requirements.txt

  coverage:frontend:
    desc: The changed lines the unit and component tests miss, after `task vitest:all -- --coverage`
    deps: [diff-cover]
    vars: &diff_base
      # CI's clone holds the one commit it tests: the base is fetched, a pull
      # request's target branch or the commit the previous pipeline ran, and
      # compared with `..` because no merge base is there. A base that cannot
      # be fetched falls back to the parent commit.
      DIFF_BASE:
        sh: |
          if [ -z "$CI" ]; then git rev-parse {{.BASE}}; exit; fi
          want=$CI_PREV_COMMIT_SHA
          [ -n "$CI_COMMIT_PULL_REQUEST" ] && want=$CI_COMMIT_TARGET_BRANCH
          if [ -n "$want" ] && git fetch -q --no-tags --depth=1 origin "$want"; then
            git rev-parse FETCH_HEAD
          else
            git fetch -q --no-tags --depth=2 origin "$(git rev-parse HEAD)" && git rev-parse HEAD~1
          fi
    cmds:
      # The total is vitest's own text-summary, printed by the run.
      - tools/diff-cover/.venv/bin/diff-cover frontend/coverage/lcov.info --compare-branch={{.DIFF_BASE}} --diff-range-notation=..

  coverage:go:
    desc: What the Go suite reaches, with what the servers wrote to GOCOVERDIR when set
    deps: [diff-cover]
    vars: *diff_base
    cmds:
      # CI's go.yaml ran this exact command and the agent shares the build
      # cache, so most packages replay from Go's test cache; those reading
      # repo files (sync, lists) see a fresh clone's mtimes and run again,
      # about a minute.
      - cd backend && go test -tags no_ui -coverpkg=./... -coverprofile=coverage.out ./...
      # The servers' counters (build-app, build-backend, build-demo) added to
      # it: a block counts as reached when either reached it.
      - |
        cd backend && cp coverage.out coverage-all.out
        {{if .GOCOVERDIR}}go tool covdata textfmt -i="$GOCOVERDIR" -o coverage-servers.out && tail -n +2 coverage-servers.out >>coverage-all.out{{end}}
      - cd backend && go tool cover -func=coverage-all.out | tail -n 1
      - go -C tools/gcov2lcov install tool
      - cd backend && gcov2lcov -infile coverage-all.out -outfile coverage.lcov
      - tools/diff-cover/.venv/bin/diff-cover backend/coverage.lcov --compare-branch={{.DIFF_BASE}} --diff-range-notation=..

  # --- browser harnesses ----------------------------------------------------------
  # Each takes Playwright's own arguments after `--`: spec files, -g, --last-failed.
  build-spa:
    desc: The SPA into backend/pb_public, which the binary embeds ([D-64]); DEMO=1 the demo's into backend/pb_public_demo ([D-234])
    vars:
      OUT: '{{if .DEMO}}frontend/build-demo{{else}}frontend/build{{end}}'
      DEST: '{{if .DEMO}}backend/pb_public_demo{{else}}backend/pb_public{{end}}'
    cmds:
      - cd frontend && {{if .DEMO}}SHOPPINGLIST_DEMO_BUILD=1 {{end}}pnpm build
      # Which one was built, by the demo's start route: a normal SPA that
      # mentions it has demo code in it.
      - >-
        {{if .DEMO}}grep -rqF /api/demo/start {{.OUT}} ||
        { echo "build-spa: the demo SPA has no demo code — #demo must resolve to src/lib/demo/on.ts" >&2; exit 1; }{{else}}! grep -rqF /api/demo/start {{.OUT}} ||
        { echo "build-spa: the normal SPA contains demo code — #demo must resolve to src/lib/demo/off.ts" >&2; exit 1; }{{end}}
      - rm -rf {{.DEST}} && mkdir -p {{.DEST}} && cp -r {{.OUT}}/. {{.DEST}}/

  build-app:
    desc: The binary with the real SPA embedded ([D-64]), for the browser harnesses
    # One list for both builds: a change only the demo uses rebuilds the app
    # too, which costs a build and drifts nothing.
    sources: &app
      - frontend/src/**/*
      - frontend/messages/**/*
      - frontend/project.inlang/{settings.json,paraglide.config.js}
      - frontend/static/**/*
      - exclude: frontend/src/lib/paraglide/**/*
      - frontend/*.{js,ts,json}
      - frontend/scripts/*.js
      - frontend/pnpm-lock.yaml
      - backend/**/*.go
      - backend/**/*.json
      - backend/go.mod
      - backend/go.sum
      - exclude: backend/pb_data/**/*
      - exclude: backend/pb_public*/**/*
      - Taskfile.yml
    generates:
      - backend/shoppinglist
    cmds:
      - defer: *failed
      - task: build-spa
      - cd backend && go build {{if .GOCOVERDIR}}-cover {{end}}-o shoppinglist .

  e2e:functional:
    desc: The functional suite (e2e/tests, 8097)
    deps: [deps, build-app]
    env: { SHOPPINGLIST_BIN: '{{.BIN}}' }
    cmds:
      - defer: *failed
      - 'cd e2e && {{.ROOT_DIR}}/{{.LOCK}} e2e:functional npx playwright test {{.CLI_ARGS}}'

  e2e:arch:
    desc: The architectural walk (e2e/arch, 8096, [D-124])
    deps: [deps, build-app]
    env: { SHOPPINGLIST_BIN: '{{.BIN}}' }
    cmds:
      - defer: *failed
      - 'cd e2e && {{.ROOT_DIR}}/{{.LOCK}} e2e:arch npx playwright test -c arch/arch.config.ts {{.CLI_ARGS}}'

  e2e:oidc:
    desc: The OIDC journeys against Dex (e2e/oidc, 8095, [D-154])
    deps: [deps, build-app]
    env: { SHOPPINGLIST_BIN: '{{.BIN}}' }
    cmds:
      - defer: *failed
      - 'cd e2e && {{.ROOT_DIR}}/{{.LOCK}} e2e:oidc npx playwright test -c oidc/oidc.config.ts {{.CLI_ARGS}}'

  e2e:tiles:
    desc: The tile and state audits on the design gallery, no backend (e2e/tiles, 8093, [D-166])
    deps: [deps]
    cmds:
      - defer: *failed
      - 'cd e2e && {{.ROOT_DIR}}/{{.LOCK}} e2e:tiles npx playwright test -c tiles/tiles.config.ts {{.CLI_ARGS}}'

  build-demo:
    desc: The demo binary, with its own SPA embedded ([D-234]); GOARCH=arm64 for an arm64 server
    # The target in the label, so an arm64 build is not "up to date" after an
    # amd64 one.
    label: build-demo{{if .GOARCH}}-{{.GOARCH}}{{end}}
    sources: *app
    generates:
      - backend/shoppinglist-demo
    cmds:
      - defer: *failed
      - task: build-spa
        vars: { DEMO: '1' }
      # CGO off, as the releases are built (.goreleaser.yaml): one static file
      # to copy to the demo's server.
      - cd backend && CGO_ENABLED=0 go build {{if .GOCOVERDIR}}-cover {{end}}-tags demo -o shoppinglist-demo .

  e2e:demo:
    desc: The demo build's harness on its own binary (e2e/demo, 8088, [D-234])
    deps: [deps, build-demo]
    cmds:
      - defer: *failed
      - cd e2e && SHOPPINGLIST_DEMO_BIN='{{.BIN_DEMO}}' {{.ROOT_DIR}}/{{.LOCK}} e2e:demo npx playwright test -c demo/demo.config.ts {{.CLI_ARGS}}

  # --- the previous release ([D-343]) ---------------------------------------------
  # The release this build updates: on a release commit the one before it,
  # otherwise the newest. A worktree outside the checkout (docs/internals/impl-notes.md
  # says why), sharing this one's objects, which a partial clone (CI's)
  # fetches when they are first read. Only under the machine lock (e2e:upgrade
  # and e2e:all take it), as everything that reads it: another checkout's
  # previous tag replaces it.
  prev-release:
    vars: &prev
      PREV_TAG:
        sh: git describe --tags --abbrev=0 HEAD^
      PREV_ROOT:
        sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/shoppinglist-prev"
    status:
      - test -x {{.PREV_ROOT}}/{{.PREV_TAG}}/backend/shoppinglist
    cmds:
      - defer: *failed
      # Its own worktrees only: a prune would also drop those that live where
      # this container cannot see them.
      - >-
        git worktree list --porcelain | sed -n 's|^worktree \({{.PREV_ROOT}}/.*\)|\1|p' |
        while read -r tree; do git worktree remove --force "$tree"; done
      - rm -rf {{.PREV_ROOT}}
      - git worktree add -q --detach {{.PREV_ROOT}}/{{.PREV_TAG}} {{.PREV_TAG}}
      # Its binary writes no coverage: its counters belong to another tree.
      - cd {{.PREV_ROOT}}/{{.PREV_TAG}} && env -u GOCOVERDIR task deps build-app

  e2e:upgrade:
    desc: The previous release updated to this build (e2e/upgrade, 8085, and its sync suite on 8084, [D-343])
    deps: [deps]
    cmds:
      - defer: *failed
      # One build at a time ([D-177]'s box), and the previous release's tree
      # under one lock from its build to its last test.
      - task: build-app
      - task: build-backend
      - '{{.LOCK}} e2e:upgrade task e2e:upgrade:run -- {{.CLI_ARGS}}'

  e2e:upgrade:run:
    deps: [prev-release]
    vars: *prev
    cmds:
      - defer: *failed
      - cd e2e && SHOPPINGLIST_BIN='{{.BIN}}' E2E_PREVIOUS_DIR='{{.PREV_ROOT}}/{{.PREV_TAG}}' npx playwright test -c upgrade/upgrade.config.ts {{.CLI_ARGS}}
      # Its engine, as a page still running it after the update, against this server.
      - cd {{.PREV_ROOT}}/{{.PREV_TAG}}/frontend && SHOPPINGLIST_BIN='{{.BIN_NOUI}}' INTEGRATION_PORT=8084 npx vitest run --project integration --silent=passed-only

  e2e:
    desc: Every harness, one after another, as CI runs them
    cmds:
      - '{{.LOCK}} e2e task e2e:all'

  e2e:all:
    cmds:
      # Every binary before any browser: a build beside a running suite starves
      # it on the box's four cores. One harness at a time for the same reason:
      # two side by side took as long as one after the other, and timed out.
      - task: build-app
      - task: build-demo
      - task: build-backend
      - task: prev-release
      - task: e2e:functional
      - task: e2e:arch
      - task: e2e:oidc
      - task: e2e:tiles
      - task: e2e:demo
      - task: e2e:upgrade
