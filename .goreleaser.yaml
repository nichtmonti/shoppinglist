# GoReleaser config (docs/internals/design.md §14, [D-36]).
# Ships both §14 artifacts from one pipeline: a multi-arch Docker image (incl.
# arm64 for Raspberry Pi) and a plain binary + dist zip (no Docker required).
# A second build and image carry the demo ([D-234], [D-235]): the :demo tag.
#
# Before running `goreleaser release` (or `--snapshot`), the SPA must already
# be built into backend/pb_public — a COMPILE requirement ([D-64]):
# public_embed.go embeds the directory, so `go build` itself fails without it.
# `task build-spa` does that, and the release workflow
# (.woodpecker/release.yaml) runs it in its `release-frontend` step first.
#
# The image name and the release's repository are not hard-coded: the image
# takes Woodpecker's CI_REPO (owner/name), and the release target is derived
# from the git remote.
version: 2

project_name: shoppinglist

builds:
  - id: shoppinglist
    # Go module lives in backend/ (monorepo).
    dir: backend
    main: .
    binary: shoppinglist
    # Spelled out rather than left to GoReleaser's default (which is exactly
    # this): main.version/main.commit are what `shoppinglist --version` and the
    # startup banner report, and a future `ldflags:` added here for any other
    # reason would silently drop them if they were only implicit.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    # Note: backend/cmd/appendseed is dev-time seed-editing tooling and is NOT shipped here.
    # The main binary also embeds the `dictionary-suggestions` curate CLI per §6.13.

  # The demo build ([D-234]), shipped only as the :demo image below — no
  # archive. -tags demo embeds backend/pb_public_demo instead of pb_public,
  # which the release workflow's release-frontend step builds as well.
  - id: shoppinglist-demo
    dir: backend
    main: .
    binary: shoppinglist-demo
    flags:
      - -tags=demo
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]

# The "no Docker required" artifact (§14). The SPA is inside the binary
# ([D-64]), so this is the binary plus documentation — nothing has to stay
# alongside it for the app to serve its own shell.
archives:
  - id: shoppinglist
    ids: [shoppinglist]
    formats: [zip]
    name_template: "shoppinglist_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # Setting `files` replaces GoReleaser's default LICENSE*/README* globs,
      # so both are listed explicitly: the zip carries its license, and someone
      # who downloaded only the zip still gets the "how do I run this" notes.
      - LICENSE
      # The licences and notices of every third-party component compiled
      # into the binary (Go modules and the embedded SPA's npm packages);
      # generated by `task licenses`.
      - docs/THIRD_PARTY_LICENSES.md
      - docs/sbom.cdx.json
      - README.md
      - CHANGELOG.md
      - docs/deploying.md
      - docs/deploy-reference.md
      - docs/operating.md

checksum:
  name_template: "checksums.txt"

# Multi-arch Docker image (§14) via buildx (dockers_v2, [D-36]) — one entry,
# one `docker buildx build --platform linux/amd64,linux/arm64`, no separate
# docker_manifests merge step. Requires a buildx builder that can emit
# multi-platform images (the docker-container driver) on the runner; the
# release step in .woodpecker/release.yaml creates one. No QEMU: the
# Dockerfile only COPYs the prebuilt per-arch binaries, so nothing executes
# foreign-arch code during the build.
dockers_v2:
  - id: shoppinglist
    ids: [shoppinglist]
    dockerfile: Dockerfile
    images:
      # Woodpecker's CI_REPO (owner/name) in the release workflow; a local
      # --snapshot build, which pushes nothing, falls back to a placeholder.
      - 'codeberg.org/{{ tolower (envOrDefault "CI_REPO" "local/shoppinglist") }}'
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      "org.opencontainers.image.description": "Self-hosted offline-first shared shopping list PWA"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      # The repository's LICENSE: the GNU AGPL v3, without "or later".
      "org.opencontainers.image.licenses": "AGPL-3.0-only"

  # The demo image ([D-234]): `docker run -p 8090:8090 …:demo` is the README's
  # way to try the app. Same repository, its own tags, so `latest` stays the
  # real app.
  - id: shoppinglist-demo
    ids: [shoppinglist-demo]
    dockerfile: Dockerfile.demo
    images:
      - 'codeberg.org/{{ tolower (envOrDefault "CI_REPO" "local/shoppinglist") }}'
    tags:
      - "{{ .Version }}-demo"
      - "{{ if not .IsNightly }}demo{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      "org.opencontainers.image.description": "Demo build of the self-hosted shopping list: one-button guest accounts, deleted after 24 hours"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.licenses": "AGPL-3.0-only"

# The Gitea owner/name are left to GoReleaser, which takes them from the git
# remote (Woodpecker's clone of this repository).
release:
  name_template: "v{{ .Version }}"
  # The CycloneDX SBOM of what ships ([D-203]): the Go modules linked into
  # the binary and the npm code bundled into the web app, generated with the
  # licence notice (scripts/third-party-licenses.mjs). The images carry
  # buildkit's own SBOM attestation besides (dockers_v2 `sbom`, on by
  # default), which lists the base image's packages but cannot see the npm
  # code compiled into the binary.
  extra_files:
    - glob: ./docs/sbom.cdx.json

# Self-hosted Gitea (Codeberg) — GITEA_URLS has no single default host the way
# github.com does, so it must be pointed at Codeberg explicitly ([D-35]).
gitea_urls:
  api: https://codeberg.org/api/v1
  download: https://codeberg.org

# Ambiguity guard: this project only ever authenticates as Gitea (GITEA_TOKEN),
# never GitHub/GitLab, so force_token removes any doubt about which token
# GoReleaser should look for.
force_token: gitea

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs?:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
